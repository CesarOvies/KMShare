<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B14"/>
    </radialGradient>

    <!-- Monitor 1 (Sender / Primary) Gradient -->
    <linearGradient id="monLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Monitor 2 (Receiver / Secondary) Gradient -->
    <linearGradient id="monRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Pointer Glow / Trajectory Gradient -->
    <linearGradient id="cursorBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filter for Cursor Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Background Rounded Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- 2. Dual Monitors: Hardware Stands -->
  <!-- Left Stand -->
  <path d="M152 320 L152 352 L116 352 L116 364 L212 364 L212 352 L176 352 L176 320 Z" fill="#334155"/>
  <!-- Right Stand -->
  <path d="M336 320 L336 352 L300 352 L300 364 L396 364 L396 352 L360 352 L360 320 Z" fill="#334155"/>

  <!-- 3. Left Monitor (Host / Sender) -->
  <rect x="76" y="128" width="176" height="196" rx="14" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <!-- Screen Glass -->
  <rect x="88" y="140" width="152" height="172" rx="8" fill="#1E293B"/>
  <rect x="88" y="140" width="152" height="172" rx="8" fill="url(#monLeftGrad)" opacity="0.25"/>

  <!-- Stylized Keyboard Rows on Left Screen -->
  <g fill="#475569" opacity="0.6">
    <rect x="100" y="254" width="16" height="10" rx="2"/>
    <rect x="122" y="254" width="16" height="10" rx="2"/>
    <rect x="144" y="254" width="16" height="10" rx="2"/>
    <rect x="166" y="254" width="16" height="10" rx="2"/>
    <rect x="188" y="254" width="16" height="10" rx="2"/>
    <rect x="210" y="254" width="16" height="10" rx="2"/>

    <rect x="104" y="270" width="20" height="10" rx="2"/>
    <rect x="130" y="270" width="68" height="10" rx="2" fill="#3B82F6" opacity="0.9"/>
    <rect x="204" y="270" width="22" height="10" rx="2"/>
  </g>

  <!-- 4. Right Monitor (Receiver / Remote) -->
  <rect x="260" y="128" width="176" height="196" rx="14" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <!-- Screen Glass -->
  <rect x="272" y="140" width="152" height="172" rx="8" fill="#1E293B"/>
  <rect x="272" y="140" width="152" height="172" rx="8" fill="url(#monRightGrad)" opacity="0.25"/>

  <!-- Active Border Glow on Shared Edges -->
  <line x1="240" y1="140" x2="240" y2="312" stroke="#3B82F6" stroke-width="3" opacity="0.8"/>
  <line x1="272" y1="140" x2="272" y2="312" stroke="#06B6D4" stroke-width="3" opacity="0.8"/>

  <!-- 5. Edge Crossing Bridge Beam (LAN 1000Hz / Bluetooth 133Hz Wave) -->
  <path d="M 180 200 Q 256 165 316 200" fill="none" stroke="url(#cursorBeam)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Pulse Rings Crossing Edge -->
  <circle cx="256" cy="182" r="14" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="182" r="24" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>

  <!-- Dynamic Cursor Traversing Edge -->
  <g transform="translate(306, 188) rotate(-15)" filter="url(#pulseGlow)">
    <!-- Cursor Shadow -->
    <path d="M0 0 L28 42 L16 42 L22 58 L12 62 L6 46 L-4 54 Z" fill="#0284C7" opacity="0.4"/>
    <!-- Main Neon Pointer -->
    <path d="M0 0 L24 36 L13 36 L18 50 L10 54 L5 40 L-4 46 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
  </g>

  <!-- 6. Cryptographic Security Badge (P-256 + AES-GCM Intranet Guard) -->
  <g transform="translate(256, 386)">
    <!-- Outer Shield Glow -->
    <path d="M0 -34 C26 -34 38 -26 44 -20 C44 8 28 34 0 46 C-28 34 -44 8 -44 -20 C-38 -26 -26 -34 0 -34 Z"
          fill="#064E3B" opacity="0.4" filter="url(#glow)"/>
    <!-- Main Shield -->
    <path d="M0 -32 C24 -32 36 -24 40 -18 C40 6 25 30 0 42 C-25 30 -40 6 -40 -18 C-36 -24 -24 -32 0 -32 Z"
          fill="url(#shieldGrad)" stroke="#34D399" stroke-width="2.5"/>
    <!-- Padlock Shackle -->
    <path d="M -10 -8 L -10 -18 C -10 -24 10 -24 10 -18 L 10 -8"
          fill="none" stroke="#ECFDF5" stroke-width="3" stroke-linecap="round"/>
    <!-- Padlock Body -->
    <rect x="-14" y="-8" width="28" height="22" rx="4" fill="#ECFDF5"/>
    <!-- Keyhole -->
    <circle cx="0" cy="0" r="2.5" fill="#047857"/>
    <path d="M-1.5 0 L1.5 0 L2 7 L-2 7 Z" fill="#047857"/>
  </g>

  <!-- 7. Typography Branding (KMShare) -->
  <text x="256" y="478"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34"
        font-weight="800"
        letter-spacing="4"
        fill="#F8FAFC">KMSHARE</text>
  <text x="256" y="498"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12"
        font-weight="600"
        letter-spacing="2"
        fill="#94A3B8">SECURE INTRANET KVM</text>
</svg>

